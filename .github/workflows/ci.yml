name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit/ref to test — defaults to whatever triggered this run when omitted"
        required: false
        type: string

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      SESSION_SECRET: ci-dummy-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # Also verifies every migration file applies cleanly, in order,
      # against a fresh database — catches a bad/out-of-order
      # migration before it ever reaches staging or production.
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
