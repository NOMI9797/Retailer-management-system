name: Deploy Staging

# Every push to staging deploys automatically — no manual step. This
# is the "test it live" environment, so it should always reflect the
# latest staging commit with zero friction. Production never deploys
# from this file at all — see deploy-production.yml, which only runs
# on a manual trigger.
on:
  push:
    branches: [staging]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Migrations run BEFORE the app deploys, so a bad migration
      # never leaves a deployed app pointed at a schema it doesn't
      # match.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy and capture its URL
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # vercel deploy (without --prod) creates a new, uniquely-hashed
      # preview URL every time — it does NOT move the stable
      # git-staging-*.vercel.app alias to point at it, since that's
      # normally Vercel's own auto-deploy's job, which this pipeline
      # deliberately bypasses (see the Ignored Build Step in
      # docs/deployment.md). Without this, "the staging URL" would be
      # a different link after every single push.
      - run: vercel alias set "${{ steps.deploy.outputs.url }}" retailer-management-system-git-staging-noman-ahmads-projects.vercel.app --scope=${{ secrets.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Shows exactly what's now waiting to be promoted to production
      # — this commit, plus any earlier staging commits main still
      # doesn't have. Visible right in the run's own summary, no need
      # to go dig through `git log` separately before deciding what to
      # deploy.
      - name: Show commits pending for production
        run: |
          git fetch origin main
          echo "## Pending for production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commits on staging not yet on main:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git log origin/main..HEAD --pretty=format:"- \`%h\` %s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To ship this commit (or any of the above) to production: Actions → Deploy Production → Run workflow → paste the commit SHA (or leave blank for the latest)." >> $GITHUB_STEP_SUMMARY
